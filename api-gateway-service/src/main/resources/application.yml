server:
  port: 8080

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      routes: []
    discovery:
      enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis123
      connect-timeout: 5000
      timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.sentinelflow: DEBUG
