name: SentinelFlow CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_DB: sentinelflow
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sentinelflow-frontend/package-lock.json

      - name: Build API Gateway
        run: cd api-gateway-service && mvn clean package -DskipTests

      - name: Build Ingestion Service
        run: cd ingestion-service && mvn clean package -DskipTests

      - name: Build Fraud Detection Service
        run: cd fraud-detection-service && mvn clean package -DskipTests

      - name: Build AI Insight Service
        run: cd ai-insight-service && mvn clean package -DskipTests

      - name: Build Analytics Service
        run: cd analytics-service && mvn clean package -DskipTests

      - name: Build Frontend
        run: cd sentinelflow-frontend && npm ci --legacy-peer-deps && npm run build

      - name: Verify all JARs exist
        run: |
          ls api-gateway-service/target/*.jar
          ls ingestion-service/target/*.jar
          ls fraud-detection-service/target/*.jar
          ls ai-insight-service/target/*.jar
          ls analytics-service/target/*.jar

      - name: Summary
        run: |
          echo "✅ SentinelFlow CI passed!"
          echo "All 5 Spring Boot services compiled successfully"
          echo "React frontend built successfully"
