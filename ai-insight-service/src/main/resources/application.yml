server:
  port: 8084

spring:
  application:
    name: ai-insight-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinelflow}
    username: ${DB_USER:sentinelflow}
    password: ${DB_PASSWORD:sentinelflow}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-insight-service
      auto-offset-reset: earliest
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dev-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small

ai:
  semantic-cache:
    similarity-threshold: ${SEMANTIC_CACHE_THRESHOLD:0.92}
    ttl-seconds: ${SEMANTIC_CACHE_TTL:3600}
  rag:
    top-k-results: ${RAG_TOP_K:5}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.sentinelflow: DEBUG
