server:
  port: 8084

spring:
  application:
    name: ai-insight-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelflow
    username: sentinelflow
    password: sentinelflow123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: ai-insight-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.sentinelflow: DEBUG
